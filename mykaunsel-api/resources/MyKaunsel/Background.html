<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background — MyKaunsel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#FFFFFF; font-family:'Plus Jakarta Sans',sans-serif; color:#0E2A33; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

  .mesh-wrap { position: fixed; inset: 0; overflow: hidden; z-index: 0; background:#FFFFFF; }

  .plume { position: absolute; top: 50%; left: 50%; }

  .strand { position: absolute; top: 50%; left: 78%; width: 22vw; height: 150vh;
    border-radius: 50%; overflow: hidden; filter: blur(26px);
    transform-origin: center center; will-change: transform; }
  .strand-inner { position: absolute; inset: -10%; }
  .strand-lines { position: absolute; inset: -10%; mix-blend-mode: soft-light; opacity: .5;
    background: repeating-linear-gradient(0deg,
      rgba(255,255,255,.8) 0px, rgba(255,255,255,.8) 1.5px,
      transparent 3px, transparent 7px);
    filter: blur(1px); }

  .s1 { width: 20vw; margin-left: -14vw; transform: translate(-50%,-50%) rotate(-38deg); animation: sway-s1 11s ease-in-out infinite; }
  .s1 .strand-inner { background: linear-gradient(180deg, transparent 0%, #6E8CFB 12%, #4A7DFF 32%, #14919B 55%, transparent 88%); }

  .s2 { width: 24vw; margin-left: -4vw; transform: translate(-50%,-50%) rotate(-32deg); animation: sway-s2 14s ease-in-out infinite; }
  .s2 .strand-inner { background: linear-gradient(180deg, transparent 0%, #8B6FE0 10%, #0F6B7D 34%, #14919B 58%, transparent 90%); }

  .s3 { width: 27vw; margin-left: 6vw; transform: translate(-50%,-50%) rotate(-27deg); animation: sway-s3 12s ease-in-out infinite; }
  .s3 .strand-inner { background: linear-gradient(180deg, transparent 0%, #E8709A 10%, #D98F4A 35%, #F2C14E 62%, transparent 92%); }

  .s4 { width: 16vw; margin-left: 18vw; transform: translate(-50%,-50%) rotate(-22deg); animation: sway-s4 15s ease-in-out infinite; }
  .s4 .strand-inner { background: linear-gradient(180deg, transparent 0%, #4A7DFF 15%, #8B6FE0 40%, #F2C14E 70%, transparent 94%); opacity: .85; }

  @keyframes sway-s1 {
    0%, 100% { transform: translate(-50%,-50%) rotate(-38deg) scale(1); }
    50%      { transform: translate(-72%,-28%) rotate(-16deg) scale(1.3); }
  }
  @keyframes sway-s2 {
    0%, 100% { transform: translate(-50%,-50%) rotate(-32deg) scale(1); }
    50%      { transform: translate(-28%,-72%) rotate(-52deg) scale(1.28); }
  }
  @keyframes sway-s3 {
    0%, 100% { transform: translate(-50%,-50%) rotate(-27deg) scale(1); }
    50%      { transform: translate(-74%,-26%) rotate(-6deg) scale(1.32); }
  }
  @keyframes sway-s4 {
    0%, 100% { transform: translate(-50%,-50%) rotate(-22deg) scale(1); }
    50%      { transform: translate(-26%,-74%) rotate(-44deg) scale(1.35); }
  }

  @media (prefers-reduced-motion: reduce) {
    .s1, .s2, .s3, .s4 { animation: none !important; }
  }

  .mesh-veil { position: absolute; inset: 0; background: rgba(255,255,255,.12); }
  .isi { position: relative; z-index: 1; }

  #bg1 .s1 { width: 30vw; }
  #bg1 .s2 { width: 34vw; }
  #bg1 .s3 { width: 37vw; }
  #bg1 .s4 { width: 24vw; }

  /* BG2 — shifted right, softer, more faded */
  #bg2 .plume { left: 122%; }
  #bg2 .strand { left: 140%; filter: blur(46px); }
  #bg2 .mesh-veil { background: rgba(255,255,255,.58); }
  #bg2 .s1 .strand-inner { background: linear-gradient(180deg, transparent 0%, #A9C4FF 12%, #4A7DFF 32%, #4CC9A0 55%, transparent 88%); }
  #bg2 .s2 .strand-inner { background: linear-gradient(180deg, transparent 0%, #6FA0FF 10%, #1A4550 34%, #4CC9A0 58%, transparent 90%); }
  #bg2 .s3 .strand-inner { background: linear-gradient(180deg, transparent 0%, #4CC9A0 10%, #2FA88A 35%, #6FA0FF 62%, transparent 92%); }
  #bg2 .s4 .strand-inner { background: linear-gradient(180deg, transparent 0%, #A9C4FF 15%, #4CC9A0 40%, #4A7DFF 70%, transparent 94%); opacity: .85; }

  .bg-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border: 1px solid rgba(14,42,51,.1); border-radius: 999px; padding: 8px 10px; box-shadow: 0 12px 30px -14px rgba(14,42,51,.25); }
  .bg-nav button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; border: none;
    background: #FAF8F5; color: #0E2A33; cursor: pointer; transition: background-color .2s ease; }
  .bg-nav button:hover { background: #EFEBE3; }
  .bg-nav span { font-size: 13.5px; font-weight: 500; color: #0E2A33; min-width: 52px; text-align: center; }
</style>
</head>
<body>

<!-- BG1: current design -->
<div id="wrapBG1" class="mesh-wrap" aria-hidden="true">
  <div id="bg1" class="plume">
    <div class="strand s1"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s2"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s3"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s4"><div class="strand-inner"></div><div class="strand-lines"></div></div>
  </div>
  <div class="mesh-veil"></div>
</div>

<!-- BG2: shifted right, softer, more faded -->
<div id="wrapBG2" class="mesh-wrap" aria-hidden="true">
  <div id="bg2" class="plume">
    <div class="strand s1"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s2"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s3"><div class="strand-inner"></div><div class="strand-lines"></div></div>
    <div class="strand s4"><div class="strand-inner"></div><div class="strand-lines"></div></div>
  </div>
  <div class="mesh-veil"></div>
</div>

<div class="isi grid min-h-screen place-items-center px-6">
  <div class="max-w-[440px] rounded-2xl bg-white/80 p-8 text-center backdrop-blur-sm">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl" style="background:rgba(15,107,125,.10);color:#0F6B7D">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 3"/></svg>
    </span>
    <h1 class="mt-6 text-[28px] font-semibold tracking-[-0.03em]">Waiting for approval</h1>
    <p class="mt-3 text-[14.5px] leading-relaxed" style="color:rgba(14,42,51,.6)">Demo content to show the feather-plume gradient background. Copy the <code>.mesh-wrap</code> block and its CSS into any screen — nothing else on this page is part of the effect.</p>
  </div>
</div>

<div class="bg-nav">
  <button type="button" id="bgPrev" aria-label="Previous background">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <span id="bgLabel">BG 1</span>
  <button type="button" id="bgNext" aria-label="Next background">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<script>
(function(){
  var wraps = [document.getElementById('wrapBG1'), document.getElementById('wrapBG2')];
  var label = document.getElementById('bgLabel');
  var i = 0;
  function papar(){
    wraps.forEach(function(w, n){ w.style.display = n === i ? 'block' : 'none'; });
    label.textContent = 'BG ' + (i + 1);
  }
  document.getElementById('bgPrev').addEventListener('click', function(){ i = (i - 1 + wraps.length) % wraps.length; papar(); });
  document.getElementById('bgNext').addEventListener('click', function(){ i = (i + 1) % wraps.length; papar(); });
  papar();
})();
</script>

</body>
</html>
